name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Robolectric needs Java 21 to run the tests on Android SDK 36+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle wrapper, dependencies and the local build cache.
      # The cache is written only from the default branch; PRs restore it read-only.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # A single invocation avoids configuring the project twice.
      # core:domain is a pure Kotlin module: its tests run with `test`, not `testDebugUnitTest`.
      # buildHealth fails on an unused, misdeclared or duplicate dependency.
      - name: Build, unit tests, screenshot tests & dependency health
        run: ./gradlew assembleDebug testDebugUnitTest :core:domain:test validateDebugScreenshotTest buildHealth --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/screenshotTest/
            build/reports/dependency-analysis/
          if-no-files-found: ignore
